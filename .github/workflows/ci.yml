name: ChaoN CI

on:
  pull_request:
    branches: [main, feat/esp-idf-foundation, feat/sd-readonly-probe]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chaon-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-c:
    name: Native C parser/VM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Host unit tests (-Werror)
        run: make test
      - name: Offline release packager unit tests
        run: python3 -m unittest discover -s tests -p test_release_package.py
      - name: UBSan build and run
        run: |
          make clean
          make test CFLAGS="-std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=undefined -fno-omit-frame-pointer"

  esp32s3:
    name: ESP-IDF v5.5.3 / original T-Dongle-S3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build ESP32-S3
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32s3
          path: .
      - name: Stage and verify experimental candidate package (not published)
        shell: bash
        run: |
          set -euo pipefail
          tree_sha256="$(git archive --format=tar HEAD | sha256sum | awk '{print $1}')"
          python3 tools/release_package.py pack \
            --build-dir build --lock dependencies.lock \
            --source-commit "$(git rev-parse HEAD)" \
            --source-tree-sha256 "$tree_sha256" \
            --out build/chaon-experimental-candidate.zip
          python3 tools/release_package.py verify \
            --archive build/chaon-experimental-candidate.zip \
            --source-commit "$(git rev-parse HEAD)"
      - name: Upload flashable firmware inputs
        uses: actions/upload-artifact@v7
        with:
          name: chaon-esp32s3-candidate
          if-no-files-found: error
          retention-days: 30
          path: |
            build/chaon.bin
            build/chaon.elf
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flash_args
            build/flasher_args.json
            dependencies.lock
            build/chaon-experimental-candidate.zip
