name: ChaoN CI

on:
  push:
    branches: ['rc/**']
  pull_request:
    branches: [main, feat/esp-idf-foundation, feat/sd-readonly-probe]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chaon-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-c:
    name: Native C parser/VM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Host unit tests (-Werror)
        run: make test
      - name: Offline release packager unit tests
        run: python3 -m unittest discover -s tests -p test_release_package.py
      - name: MSC ownership and no-format policy guardrails
        run: python3 -m unittest discover -s tests -p test_usb_msc_policy.py
      - name: UBSan build and run
        run: |
          make clean
          make test CFLAGS="-std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=undefined -fno-omit-frame-pointer"

  esp32s3:
    name: ESP-IDF v5.5.3 / original T-Dongle-S3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build ESP32-S3
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32s3
          path: .
      - name: Stage and verify experimental candidate package (not published)
        shell: bash
        run: |
          set -euo pipefail
          tree_sha256="$(git archive --format=tar HEAD | sha256sum | awk '{print $1}')"
          python3 tools/release_package.py pack \
            --build-dir build --lock dependencies.lock \
            --source-commit "$(git rev-parse HEAD)" \
            --source-tree-sha256 "$tree_sha256" \
            --out "$RUNNER_TEMP/chaon-experimental-candidate.zip"
          python3 tools/release_package.py verify \
            --archive "$RUNNER_TEMP/chaon-experimental-candidate.zip" \
            --source-commit "$(git rev-parse HEAD)"
      - name: Record exact-source CI candidate provenance
        if: startsWith(github.ref, 'refs/heads/rc/') && github.event_name == 'push'
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          pkg = pathlib.Path(os.environ["RUNNER_TEMP"]) / "chaon-experimental-candidate.zip"
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          content = {
              "schema_version": 1,
              "kind": "ChaoN-original-T-Dongle-S3-experimental-RC-build",
              "repository": os.environ["REPO"],
              "source_ref": "refs/heads/" + os.environ["REF_NAME"],
              "source_commit": commit,
              "github_actions_run_id": int(os.environ["RUN_ID"]),
              "github_actions_run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "github_actions_run_url": (os.environ["SERVER_URL"] + "/" +
                                         os.environ["REPO"] + "/actions/runs/" +
                                         os.environ["RUN_ID"]),
              "candidate_zip_sha256": hashlib.sha256(pkg.read_bytes()).hexdigest(),
              "artifact_authenticity": "NOT_SIGNED_CI_RUN_PROVENANCE_ONLY",
              "physical_validation": "NOT_ESTABLISHED_FOR_THIS_EXACT_BINARY",
          }
          output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "rc-provenance.json"
          output.write_text(json.dumps(content, indent=2, sort_keys=True) + "\n")
          PY
      - name: Upload flashable firmware inputs
        uses: actions/upload-artifact@v7
        with:
          name: chaon-esp32s3-candidate
          if-no-files-found: error
          retention-days: 30
          path: |
            build/chaon.bin
            build/chaon.elf
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flash_args
            build/flasher_args.json
            dependencies.lock
            ${{ runner.temp }}/chaon-experimental-candidate.zip
            ${{ runner.temp }}/rc-provenance.json
